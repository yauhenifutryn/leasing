; -- Dialplan: route calls to voice bot via AudioSocket --
;
; UUID generation: /proc/sys/kernel/random/uuid produces a proper UUID.
; FILTER strips the trailing newline from SHELL().
; Asterisk's CHANNEL(uniqueid) is NOT a valid UUID format.

[general]

[globals]

[default]
include => voice-bot

[voice-bot]
; Wait(1) after Answer() gives the RTP media path time to establish
; before AudioSocket takes control of the channel. Without it,
; AudioSocket may acquire the channel before RTP is flowing.
exten => 100,1,Answer()
same => n,Wait(1)
same => n,Set(DENOISE(rx)=on)
same => n,Set(CALL_UUID=${FILTER(0-9a-f-,${SHELL(cat /proc/sys/kernel/random/uuid)})})
same => n,AudioSocket(${CALL_UUID},127.0.0.1:9092)
same => n,Hangup()

exten => _X.,1,Answer()
same => n,Wait(1)
same => n,Set(DENOISE(rx)=on)
same => n,Set(CALL_UUID=${FILTER(0-9a-f-,${SHELL(cat /proc/sys/kernel/random/uuid)})})
same => n,AudioSocket(${CALL_UUID},127.0.0.1:9092)
same => n,Hangup()
