; -- Dialplan: route calls to voice bot via AudioSocket --
;
; UUID generation: /proc/sys/kernel/random/uuid produces a proper UUID.
; FILTER strips the trailing newline from SHELL().
; Asterisk's CHANNEL(uniqueid) is NOT a valid UUID format.

[general]

[globals]

[default]
include => voice-bot

[voice-bot]
exten => 100,1,Answer()
same => n,Set(CALL_UUID=${FILTER(0-9a-f-,${SHELL(cat /proc/sys/kernel/random/uuid)})})
same => n,AudioSocket(${CALL_UUID},127.0.0.1:9092)
same => n,Hangup()

exten => _X.,1,Answer()
same => n,Set(CALL_UUID=${FILTER(0-9a-f-,${SHELL(cat /proc/sys/kernel/random/uuid)})})
same => n,AudioSocket(${CALL_UUID},127.0.0.1:9092)
same => n,Hangup()
