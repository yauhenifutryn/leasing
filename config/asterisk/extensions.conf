; -- Dialplan: route calls to voice bot via AudioSocket --

[voice-bot]
; Extension 100: explicit "call the bot" number
exten => 100,1,Answer()
same => n,Set(CALL_UUID=${CHANNEL(uniqueid)})
same => n,AudioSocket(${CALL_UUID},127.0.0.1:9092)
same => n,Hangup()

; Catch-all: any other dialed number also goes to bot
exten => _X.,1,Answer()
same => n,Set(CALL_UUID=${CHANNEL(uniqueid)})
same => n,AudioSocket(${CALL_UUID},127.0.0.1:9092)
same => n,Hangup()
