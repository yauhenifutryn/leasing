; -- Asterisk PJSIP configuration for voice bot --
; Transport: UDP on standard SIP port
; Codecs: G.711 ulaw + alaw (8kHz, universal)
; direct_media=no forces audio through Asterisk (required for AudioSocket)

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; -- Endpoint template --
[softphone-template](!)
type = endpoint
context = voice-bot
disallow = all
allow = ulaw
allow = alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
identify_by = auth_username

; -- Developer account (Zoiper from Poland) --
[dev-user](softphone-template)
type = endpoint
auth = dev-user-auth
aors = dev-user-aor

[dev-user-auth]
type = auth
auth_type = userpass
username = dev
password = CHANGE_ME_dev_password

[dev-user-aor]
type = aor
max_contacts = 1

; -- Client account (Zoiper from Belarus) --
[client-user](softphone-template)
type = endpoint
auth = client-user-auth
aors = client-user-aor

[client-user-auth]
type = auth
auth_type = userpass
username = client
password = CHANGE_ME_client_password

[client-user-aor]
type = aor
max_contacts = 1
