; -- Asterisk PJSIP configuration for voice bot --
; Transport: UDP on standard SIP port
; Codecs: G.711 ulaw + alaw (8kHz, universal)
; direct_media=no forces audio through Asterisk (required for AudioSocket)
;
; IMPORTANT: Endpoint names MUST match the SIP username exactly.
; Zoiper sends "sip:dev@host" and Asterisk matches by endpoint name.

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; -- Developer account (Zoiper from developer) --
[dev]
type = endpoint
context = voice-bot
disallow = all
allow = ulaw
allow = alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
auth = dev-auth
aors = dev

[dev-auth]
type = auth
auth_type = userpass
username = dev
password = CHANGE_ME_dev_password

[dev]
type = aor
max_contacts = 1

; -- Client account (Zoiper from client) --
[client]
type = endpoint
context = voice-bot
disallow = all
allow = ulaw
allow = alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
auth = client-auth
aors = client

[client-auth]
type = auth
auth_type = userpass
username = client
password = CHANGE_ME_client_password

[client]
type = aor
max_contacts = 1
