; -- Asterisk PJSIP configuration for voice bot --
; Transport: UDP on standard SIP port
; Codecs: G.711 ulaw + alaw (8kHz, universal)
; direct_media=no forces audio through Asterisk (required for AudioSocket)
;
; IMPORTANT: Endpoint names MUST match the SIP username exactly.
; Zoiper sends "sip:dev@host" and Asterisk matches by endpoint name.

; NAT: external_media_address and external_signaling_address tell Asterisk
; to advertise the PUBLIC IP in SDP so remote clients send RTP to the right place.
; local_net defines the internal subnet so Asterisk knows which traffic is local.
; These are set by deploy_sip.sh using sed replacement of CHANGE_ME_PUBLIC_IP.
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
external_media_address = CHANGE_ME_PUBLIC_IP
external_signaling_address = CHANGE_ME_PUBLIC_IP
local_net = 10.0.0.0/8
local_net = 172.16.0.0/12
local_net = 192.168.0.0/16
local_net = 127.0.0.0/8

; -- Developer account (Zoiper from developer) --
[dev]
type = endpoint
context = voice-bot
disallow = all
allow = ulaw
allow = alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
trust_id_inbound = yes
auth = dev-auth
aors = dev

[dev-auth]
type = auth
auth_type = userpass
username = dev
password = CHANGE_ME_dev_password

[dev]
type = aor
max_contacts = 1

; -- Client account (Zoiper from client) --
[client]
type = endpoint
context = voice-bot
disallow = all
allow = ulaw
allow = alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
auth = client-auth
aors = client

[client-auth]
type = auth
auth_type = userpass
username = client
password = CHANGE_ME_client_password

[client]
type = aor
max_contacts = 1
