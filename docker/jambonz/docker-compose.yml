x-common-env: &common-env
  JAMBONES_MYSQL_HOST: mysql
  JAMBONES_MYSQL_USER: jambones
  JAMBONES_MYSQL_PASSWORD: ${MYSQL_PASSWORD:-JambonzDB2026!}
  JAMBONES_MYSQL_DATABASE: jambones
  JAMBONES_REDIS_HOST: redis
  JAMBONES_REDIS_PORT: 6379
  JAMBONES_TIME_SERIES_HOST: influxdb
  JAMBONES_LOGLEVEL: info
  JWT_SECRET: ${JWT_SECRET:-jambonz-voice-pipeline-jwt-2026}
  ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:-voicepipeline2026jambonz}
  JAMBONES_CLUSTER_ID: jb
  NODE_ENV: production

x-sbc-env: &sbc-env
  <<: *common-env
  DRACHTIO_HOST: drachtio-sbc
  DRACHTIO_PORT: 9022
  DRACHTIO_SECRET: cymru
  JAMBONES_NETWORK_CIDR: "172.29.0.0/16"
  JAMBONES_RTPENGINE_HOST: rtpengine
  JAMBONES_RTPENGINE_PORT: 22222

services:
  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-JambonzRoot2026!}
      MYSQL_DATABASE: jambones
      MYSQL_USER: jambones
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-JambonzDB2026!}
    volumes:
      - jambonz-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      jambonz:
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      jambonz:
    restart: unless-stopped

  influxdb:
    image: influxdb:1.8
    environment:
      INFLUXDB_DB: jambones_time_series
    volumes:
      - jambonz-influxdb:/var/lib/influxdb
    networks:
      jambonz:
    restart: unless-stopped

  # SBC drachtio: handles external SIP (Zoiper, carriers)
  drachtio-sbc:
    image: drachtio/drachtio-server:latest
    command: >
      drachtio --contact "sip:*;transport=udp"
      --contact "sip:*;transport=tcp"
      --external-ip ${PUBLIC_IP:-0.0.0.0}
      --loglevel info
      --sofia-loglevel 3
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
    networks:
      jambonz:
    restart: unless-stopped

  # Feature-server drachtio: handles internal SIP (to/from FreeSWITCH)
  drachtio-fs:
    image: drachtio/drachtio-server:latest
    command: >
      drachtio --contact "sip:*;transport=udp"
      --loglevel info
      --sofia-loglevel 3
    networks:
      jambonz:
    restart: unless-stopped

  freeswitch:
    image: drachtio/drachtio-freeswitch-mrf:latest
    volumes:
      - /tmp/freeswitch-recordings:/tmp/recordings
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      jambonz:
    restart: unless-stopped

  rtpengine:
    image: jambonz/rtpengine:latest
    ports:
      - "40000-40100:40000-40100/udp"
    environment:
      CLOUD: none
      OPTIONS: "--interface=private/0.0.0.0 --interface=public/0.0.0.0!${PUBLIC_IP:-0.0.0.0} --port-min=40000 --port-max=40100 --log-level=4"
    networks:
      jambonz:
    restart: unless-stopped

  db-create:
    image: jambonz/db-create:latest
    environment:
      JAMBONES_MYSQL_HOST: mysql
      JAMBONES_MYSQL_USER: jambones
      JAMBONES_MYSQL_PASSWORD: ${MYSQL_PASSWORD:-JambonzDB2026!}
      JAMBONES_MYSQL_DATABASE: jambones
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-JambonzRoot2026!}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      jambonz:
    restart: "no"

  api-server:
    image: jambonz/api-server:latest
    environment:
      <<: *common-env
      HTTP_PORT: 3000
      HOMER_BASE_URL: ""
      HOMER_USERNAME: ""
      HOMER_PASSWORD: ""
    ports:
      - "3000:3000"
    depends_on:
      db-create:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      jambonz:
    restart: unless-stopped

  webapp:
    image: jambonz/webapp:latest
    environment:
      API_BASE_URL: http://api-server:3000/v1
    ports:
      - "3001:3001"
    depends_on:
      - api-server
    networks:
      jambonz:
    restart: unless-stopped

  feature-server:
    image: jambonz/feature-server:latest
    environment:
      <<: *common-env
      DRACHTIO_HOST: drachtio-fs
      DRACHTIO_PORT: 9022
      DRACHTIO_SECRET: cymru
      JAMBONES_NETWORK_CIDR: "172.29.0.0/16"
      JAMBONES_RTPENGINE_HOST: rtpengine
      JAMBONES_RTPENGINE_PORT: 22222
      JAMBONES_FREESWITCH: "freeswitch:8021:JambonzR0ck$$"
      ENABLE_METRICS: 0
      HTTP_PORT: 3000
      JAMBONES_OTEL_ENABLED: 0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db-create:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      drachtio-fs:
        condition: service_started
      freeswitch:
        condition: service_started
    networks:
      jambonz:
    restart: unless-stopped

  sbc-inbound:
    image: jambonz/sbc-inbound:latest
    environment:
      <<: *sbc-env
      K8S_FEATURE_SERVER_SERVICE_NAME: feature-server
      K8S_FEATURE_SERVER_SERVICE_PORT: 3000
    depends_on:
      db-create:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      drachtio-sbc:
        condition: service_started
    networks:
      jambonz:
    restart: unless-stopped

  sbc-outbound:
    image: jambonz/sbc-outbound:latest
    environment:
      <<: *sbc-env
    depends_on:
      db-create:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      drachtio-sbc:
        condition: service_started
    networks:
      jambonz:
    restart: unless-stopped

  sbc-call-router:
    image: jambonz/sbc-call-router:latest
    environment:
      <<: *common-env
      JAMBONES_NETWORK_CIDR: "172.29.0.0/16"
      HTTP_PORT: 3000
    depends_on:
      db-create:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      jambonz:
    restart: unless-stopped

  sbc-registrar:
    image: jambonz/sbc-registrar:latest
    environment:
      <<: *sbc-env
    depends_on:
      db-create:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      drachtio-sbc:
        condition: service_started
    networks:
      jambonz:
    restart: unless-stopped

  sbc-sip-sidecar:
    image: jambonz/sbc-sip-sidecar:latest
    environment:
      <<: *sbc-env
    depends_on:
      db-create:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      drachtio-sbc:
        condition: service_started
    networks:
      jambonz:
    restart: unless-stopped

networks:
  jambonz:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16

volumes:
  jambonz-mysql:
  jambonz-influxdb:
