# Based on t0mll/jambonz-infrastructure reference docker-compose (the only tested community compose)
# Adapted for v10 images + sbc-sip-sidecar (replaces legacy sbc-registrar)

x-common-env: &common-env
  JAMBONES_MYSQL_HOST: 172.10.0.2
  JAMBONES_MYSQL_USER: jambones
  JAMBONES_MYSQL_PASSWORD: ${MYSQL_PASSWORD:-JambonzDB2026!}
  JAMBONES_MYSQL_DATABASE: jambones
  JAMBONES_REDIS_HOST: 172.10.0.3
  JAMBONES_REDIS_PORT: 6379
  JAMBONES_TIME_SERIES_HOST: 172.10.0.61
  JAMBONES_LOGLEVEL: info
  JWT_SECRET: ${JWT_SECRET:-jambonz-voice-pipeline-jwt-2026}
  ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:-voicepipeline2026jambonz}
  JAMBONES_CLUSTER_ID: jb
  NODE_ENV: production
  DRACHTIO_PORT: 9022
  DRACHTIO_SECRET: cymru
  ENABLE_METRICS: 0

networks:
  jambonz:
    driver: bridge
    ipam:
      config:
        - subnet: 172.10.0.0/16

services:
  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: jambones
      MYSQL_USER: jambones
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-JambonzDB2026!}
    volumes:
      - jambonz-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol", "tcp"]
      timeout: 5s
      retries: 10
    networks:
      jambonz:
        ipv4_address: 172.10.0.2
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      jambonz:
        ipv4_address: 172.10.0.3
    restart: unless-stopped

  influxdb:
    image: influxdb:1.8
    environment:
      INFLUXDB_DB: jambones_time_series
    volumes:
      - jambonz-influxdb:/var/lib/influxdb
    networks:
      jambonz:
        ipv4_address: 172.10.0.61
    restart: unless-stopped

  db-create:
    image: jambonz/db-create:latest
    environment:
      JAMBONES_MYSQL_HOST: 172.10.0.2
      JAMBONES_MYSQL_USER: jambones
      JAMBONES_MYSQL_PASSWORD: ${MYSQL_PASSWORD:-JambonzDB2026!}
      JAMBONES_MYSQL_DATABASE: jambones
      MYSQL_ROOT_PASSWORD: ""
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      jambonz:
    restart: "no"

  # SBC drachtio: external SIP (no http-handler, sbc-inbound handles all INVITEs directly)
  drachtio-sbc:
    image: drachtio/drachtio-server:latest
    command: >
      drachtio --contact "sip:172.10.0.10;transport=udp,tcp"
      --external-ip ${PUBLIC_IP:-0.0.0.0}
      --address 0.0.0.0 --port 9022
      --loglevel info --sofia-loglevel 3
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
    networks:
      jambonz:
        ipv4_address: 172.10.0.10
    restart: unless-stopped

  rtpengine:
    image: jambonz/rtpengine:latest
    command: >
      rtpengine --interface private/172.10.0.11
      --interface public/172.10.0.11!${PUBLIC_IP:-0.0.0.0}
      --port-min 40000 --port-max 40100
      --log-level 5
    ports:
      - "40000-40100:40000-40100/udp"
    networks:
      jambonz:
        ipv4_address: 172.10.0.11
    restart: unless-stopped

  # Feature-server drachtio: internal SIP to/from FreeSWITCH
  drachtio-fs:
    image: drachtio/drachtio-server:latest
    command: >
      drachtio --contact "sip:*;transport=udp"
      --contact "sip:*;transport=tcp"
      --address 0.0.0.0 --port 9022
    networks:
      jambonz:
        ipv4_address: 172.10.0.50
    restart: unless-stopped

  freeswitch:
    image: drachtio/drachtio-freeswitch-mrf:latest
    volumes:
      - /tmp/freeswitch-recordings:/tmp/recordings
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      jambonz:
        ipv4_address: 172.10.0.51
    restart: unless-stopped

  api-server:
    image: jambonz/api-server:latest
    environment:
      <<: *common-env
      HTTP_PORT: 3000
      HOMER_BASE_URL: ""
      HOMER_USERNAME: ""
      HOMER_PASSWORD: ""
    ports:
      - "3000:3000"
    depends_on:
      db-create:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      jambonz:
        ipv4_address: 172.10.0.30
    restart: unless-stopped

  webapp:
    image: jambonz/webapp:latest
    environment:
      API_BASE_URL: http://api-server:3000/v1
    ports:
      - "3001:3001"
    depends_on:
      - api-server
    networks:
      jambonz:
        ipv4_address: 172.10.0.31
    restart: unless-stopped

  # sbc-call-router REMOVED: not needed without outbound calls.
  # sbc-inbound handles all INVITEs directly from drachtio-sbc.

  sbc-inbound:
    image: jambonz/sbc-inbound:latest
    environment:
      <<: *common-env
      DRACHTIO_HOST: 172.10.0.10
      JAMBONES_RTPENGINES: "172.10.0.11:22222"
      JAMBONES_NETWORK_CIDR: "172.10.0.0/16"
      JAMBONES_FEATURE_SERVERS: "172.10.0.50:5060"
    depends_on:
      db-create:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      jambonz:
        ipv4_address: 172.10.0.34
    restart: unless-stopped

  # sbc-outbound REMOVED: not needed for inbound-only voice bot.

  sbc-sip-sidecar:
    image: jambonz/sbc-sip-sidecar:latest
    environment:
      <<: *common-env
      DRACHTIO_HOST: 172.10.0.10
      JAMBONES_NETWORK_CIDR: "172.10.0.0/16"
    depends_on:
      db-create:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      jambonz:
        ipv4_address: 172.10.0.36
    restart: unless-stopped

  feature-server:
    image: jambonz/feature-server:latest
    environment:
      <<: *common-env
      DRACHTIO_HOST: 172.10.0.50
      JAMBONES_NETWORK_CIDR: "172.10.0.0/16"
      JAMBONES_RTPENGINES: "172.10.0.11:22222"
      HTTP_PORT: 3000
      JAMBONES_SBCS: "172.10.0.10"
      JAMBONES_FEATURE_SERVERS: "172.10.0.50:9022:cymru"
      JAMBONES_FREESWITCH: "172.10.0.51:8021:JambonzR0ck$$"
      JAMBONES_OTEL_ENABLED: 0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db-create:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      jambonz:
        ipv4_address: 172.10.0.60
    restart: unless-stopped

volumes:
  jambonz-mysql:
  jambonz-influxdb:
