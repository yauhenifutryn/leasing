# Stress dictionary for Silero TTS v5
# Format: word -> stressed form (+ before stressed vowel)
# Applied as case-insensitive whole-word replacement before TTS synthesis.
# Silero's put_accent=True handles common words; this covers edge cases.
# Add entries when you hear incorrect pronunciation during testing.

# Confirmed by client
Футрин: Футр+ин
Футрина: Футр+ина
Футрину: Футр+ину

# Foreign names (confirmed pronunciation)
Джорджо: Дж+орджо
Микро: М+икро

# Standard Russian words Silero often gets wrong
договор: догов+ор
договора: договор+а
договоры: догов+оры
договоров: догов+оров
средства: ср+едства
обеспечение: обесп+ечение
квартал: кварт+ал
