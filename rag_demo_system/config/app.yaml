app:
  name: "Микро Лизинг · RAG Demo"
  language: "ru"
  system_prompt_path: "config/system_prompt_ru.txt"
  kb_markdown_path: "../knowledge_base/kb_faq_ru.md"
  strict_refusal_text: "К сожалению, в базе знаний нет точной информации по этому вопросу. Давайте уточню или передам специалисту"
  memory_turns: 4

embedding:
  model_name: "intfloat/multilingual-e5-large"
  batch_size: 32
  device: "cuda"
  max_characters: 6000
  chunk_size_tokens: 700
  chunk_overlap_tokens: 120

qdrant:
  url: "http://localhost:6333"
  collection: "micro_leasing_kb"

retrieval:
  vector_top_k: 8
  bm25_top_k: 8
  final_top_n: 6
  score_threshold: 0.35
  min_rerank_score: 0.10
  context_max_tokens: 1800
  fast_vector_top_k: 4
  fast_bm25_top_k: 4
  fast_final_top_n: 3
  fast_context_max_tokens: 900
  voice_vector_top_k: 10
  voice_bm25_top_k: 6
  voice_final_top_n: 4
  voice_context_max_tokens: 900

llm:
  provider: "openai_compatible"
  temperature: 0.1
  max_tokens: 420
  fast_base_url: ""
  fast_model: ""
  fast_max_tokens: 180
  timeout_sec: 60
  concise_sentences_min: 2
  concise_sentences_max: 4
  expand_triggers: ["подробнее", "детально", "поясните", "раскройте", "разверните"]

reranker:
  enabled: true
  model_name: "cross-encoder/mmarco-mMiniLMv2-L12-H384-v1"
  device: "cuda"
  batch_size: 16
  allow_no_rerank: false

query_rewrite:
  abbreviations_path: "config/abbreviations.yaml"

voice:
  enabled: false
  provider: "elevenlabs"
  api_key_env: "ELEVENLABS_API_KEY"
  voice_id_env: "ELEVENLABS_VOICE_ID"
  stt_ws_url: "wss://api.elevenlabs.io/v1/stt/stream"  # TODO: confirm exact endpoint
  tts_stream_url: "https://api.elevenlabs.io/v1/text-to-speech/{voice_id}/stream"
  sample_rate_hz: 16000
