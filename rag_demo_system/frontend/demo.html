<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Микро Лизинг · Голосовой помощник</title>
    <link rel="icon" href="favicon.ico" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f5f6f8;
        color: #1a1a2e;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .container {
        max-width: 480px;
        width: 100%;
        padding: 20px;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      .logo {
        text-align: center;
        padding: 24px 0 16px;
      }
      .logo h1 { font-size: 20px; font-weight: 600; color: #1a56db; }
      .logo p { font-size: 13px; color: #6b7280; margin-top: 4px; }
      .status-bar {
        text-align: center;
        font-size: 12px;
        color: #6b7280;
        padding: 8px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        margin-bottom: 12px;
        min-height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .status-bar.good { color: #059669; }
      .status-bar.warn { color: #d97706; }
      .status-bar.danger { color: #dc2626; }

      /* Mode tabs */
      .mode-tabs {
        display: flex;
        gap: 0;
        margin-bottom: 12px;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid #e5e7eb;
      }
      .mode-tab {
        flex: 1;
        padding: 12px;
        text-align: center;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        background: #f9fafb;
        color: #6b7280;
        border: none;
        transition: all 0.15s;
      }
      .mode-tab.active {
        background: #1a56db;
        color: #fff;
      }
      .mode-tab:not(.active):hover {
        background: #e5e7eb;
      }

      .transcript-box {
        flex: 1;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 16px;
        overflow-y: auto;
        margin-bottom: 12px;
        min-height: 200px;
        font-size: 14px;
        line-height: 1.6;
      }
      .transcript-box .turn { margin-bottom: 10px; }
      .transcript-box .turn.user { color: #1a56db; }
      .transcript-box .turn.assistant { color: #1a1a2e; }
      .transcript-box .turn .latency { color: #9ca3af; font-size: 11px; }
      .current-response {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
        min-height: 44px;
        font-size: 14px;
        color: #1a1a2e;
        line-height: 1.5;
      }

      /* Push-to-talk controls */
      .ptt-controls { display: flex; gap: 10px; padding-bottom: 20px; }
      .ptt-controls.hidden { display: none; }

      /* Streaming controls */
      .stream-controls { text-align: center; padding-bottom: 20px; }
      .stream-controls.hidden { display: none; }
      .stream-status {
        font-size: 14px;
        padding: 16px;
        border-radius: 12px;
        margin-bottom: 10px;
      }
      .stream-status.listening {
        background: #dcfce7;
        color: #059669;
        animation: pulse 2s infinite;
      }
      .stream-status.idle {
        background: #f3f4f6;
        color: #6b7280;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
      .btn-mute {
        border: none;
        border-radius: 12px;
        padding: 14px 20px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        background: #dc2626;
        color: #fff;
        width: 100%;
      }
      .btn-mute.muted {
        background: #059669;
      }

      .btn {
        border: none;
        border-radius: 12px;
        padding: 14px 20px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      .btn-talk {
        background: #059669;
        color: #fff;
        flex: 2;
      }
      .btn-talk:disabled {
        background: #e5e7eb;
        color: #9ca3af;
        cursor: not-allowed;
      }
      .btn-talk:active:not(:disabled), .btn-talk.talking {
        background: #dc2626;
        transform: scale(0.97);
      }
      .btn-download {
        background: #e5e7eb;
        color: #6b7280;
        padding: 14px;
        font-size: 18px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <h1>Микро Лизинг</h1>
        <p>Голосовой помощник</p>
        <p style="font-size:0.7em;color:#888;margin-top:4px;">Продолжая, вы соглашаетесь на обработку персональных данных</p>
      </div>

      <div class="status-bar" id="statusBar">Выберите режим для начала</div>

      <!-- Mode selection tabs -->
      <div class="mode-tabs">
        <button class="mode-tab" id="tabPTT" onclick="selectMode('ptt')">Нажми и говори</button>
        <button class="mode-tab" id="tabStream" onclick="selectMode('stream')">Свободный разговор</button>
      </div>

      <div class="transcript-box" id="transcriptBox"></div>
      <div class="current-response" id="currentResponse"></div>

      <!-- Push-to-talk controls -->
      <div class="ptt-controls hidden" id="pttControls">
        <button class="btn btn-talk" id="btnTalk" disabled>Говорить</button>
        <button class="btn btn-download" id="btnDownloadPTT" title="Скачать транскрипт">&#8681;</button>
      </div>

      <!-- Streaming controls -->
      <div class="stream-controls hidden" id="streamControls">
        <div class="stream-status idle" id="streamStatus">Подключение...</div>
        <button class="btn-mute muted" id="btnMute" onclick="toggleMute()">Включить микрофон</button>
        <div style="margin-top:10px">
          <button class="btn btn-download" id="btnDownloadStream" title="Скачать транскрипт">&#8681;</button>
        </div>
      </div>

      <!-- RTC audio playback (streaming mode only, hidden) -->
      <audio id="rtcAudio" autoplay style="display:none"></audio>
    </div>

    <script>
    const WS_BASE = `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}`;
    let ws = null;
    let connected = false;
    let talking = false;
    let audioCtx = null;
    let recorderNode = null;
    let source = null;
    let micStream = null; // single mic stream shared by WebSocket AudioWorklet + RTC
    let assistantSpeaking = false; // true when TTS is playing, used for echo gate
    let playCtx = null;
    let nextPlayTime = 0;
    let t0 = 0;
    let firstAudio = false;
    let turns = [];
    let currentMode = null; // 'ptt' or 'stream'
    let continuousStreaming = false;
    let micMuted = true;
    let rtcPc = null;

    const $ = (s) => document.querySelector(s);

    function setStatus(text, cls) {
      const bar = $("#statusBar");
      bar.textContent = text;
      bar.className = "status-bar " + (cls || "");
    }

    function addTurn(role, text, latencyMs) {
      turns.push({ role, text, latencyMs, time: new Date().toLocaleTimeString() });
      const div = document.createElement("div");
      div.className = "turn " + role;
      const prefix = role === "user" ? "Вы: " : "Ассистент: ";
      div.textContent = prefix + text;
      if (latencyMs) {
        const span = document.createElement("span");
        span.className = "latency";
        span.textContent = ` [${latencyMs}ms]`;
        div.appendChild(span);
      }
      $("#transcriptBox").appendChild(div);
      $("#transcriptBox").scrollTop = $("#transcriptBox").scrollHeight;
    }

    function stopPlayback() {
      if (playCtx && nextPlayTime > playCtx.currentTime) {
        playCtx.close();
        playCtx = null;
        nextPlayTime = 0;
      }
    }

    // ---------- Mode selection ----------
    function selectMode(mode) {
      if (currentMode === mode) return;
      currentMode = mode;

      // Update tabs
      $("#tabPTT").classList.toggle("active", mode === "ptt");
      $("#tabStream").classList.toggle("active", mode === "stream");

      // Show/hide controls
      $("#pttControls").classList.toggle("hidden", mode !== "ptt");
      $("#streamControls").classList.toggle("hidden", mode !== "stream");

      // Connect if not connected
      if (!connected) {
        connectWS(mode === "stream");
      } else {
        // Switch mode on existing connection
        if (mode === "stream") {
          ws.send(JSON.stringify({ type: "session.update", vad_mode: true }));
          micMuted = false;
          $("#btnMute").textContent = "Выключить микрофон";
          $("#btnMute").classList.remove("muted");
          $("#streamStatus").textContent = "Подключение WebRTC...";
          $("#streamStatus").className = "stream-status idle";
          startRTC();
        } else {
          ws.send(JSON.stringify({ type: "session.update", vad_mode: false }));
          continuousStreaming = false;
          stopRTC();
        }
      }
    }

    function toggleMute() {
      micMuted = !micMuted;
      continuousStreaming = !micMuted;
      if (micMuted) {
        $("#btnMute").textContent = "Включить микрофон";
        $("#btnMute").classList.add("muted");
        $("#streamStatus").textContent = "Микрофон выключен";
        $("#streamStatus").className = "stream-status idle";
      } else {
        $("#btnMute").textContent = "Выключить микрофон";
        $("#btnMute").classList.remove("muted");
        $("#streamStatus").textContent = "Слушаю...";
        $("#streamStatus").className = "stream-status listening";
      }
    }

    // ---------- WebRTC for streaming mode ----------
    async function startRTC() {
      if (rtcPc) return;

      rtcPc = new RTCPeerConnection({
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "turn:185.216.21.7:3478", username: "voicebot", credential: "voicebot2026" },
          { urls: "turn:185.216.21.7:3478?transport=tcp", username: "voicebot", credential: "voicebot2026" },
        ]
      });

      // Reuse the single mic stream (already has AEC enabled).
      // Do NOT create a second getUserMedia; dual mic captures break Chrome AEC.
      if (micStream) {
        micStream.getTracks().forEach(t => rtcPc.addTrack(t, micStream));
      }

      rtcPc.ontrack = (e) => {
        const audioEl = $("#rtcAudio");
        audioEl.srcObject = e.streams[0];
        audioEl.play().catch(() => {});
      };

      rtcPc.onicecandidate = (e) => {
        if (e.candidate && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: "rtc.ice",
            candidate: e.candidate.candidate,
            sdpMid: e.candidate.sdpMid,
            sdpMLineIndex: e.candidate.sdpMLineIndex,
          }));
        }
      };

      rtcPc.onconnectionstatechange = () => {
        if (rtcPc && rtcPc.connectionState === "connected") {
          setStatus("WebRTC подключен", "good");
          // Hybrid: keep continuousStreaming=true for WebSocket STT.
          // RTC handles barge-in in parallel.
          $("#streamStatus").textContent = "Слушаю... (WebRTC)";
          $("#streamStatus").className = "stream-status listening";
        } else if (rtcPc && rtcPc.connectionState === "failed") {
          setStatus("WebRTC ошибка", "warn");
          stopRTC();
          continuousStreaming = true;
        }
      };

      const offer = await rtcPc.createOffer();
      await rtcPc.setLocalDescription(offer);
      ws.send(JSON.stringify({ type: "rtc.offer", sdp: offer.sdp }));
    }

    function stopRTC() {
      if (rtcPc) {
        rtcPc.close();
        rtcPc = null;
      }
      // Don't stop micStream; it's shared with the AudioWorklet for PTT
      const audioEl = $("#rtcAudio");
      if (audioEl) audioEl.srcObject = null;
    }

    // ---------- Audio ----------
    function b64ToInt16(b64) {
      const bin = atob(b64);
      const buf = new Int16Array(bin.length / 2);
      for (let i = 0; i < buf.length; i++) {
        buf[i] = (bin.charCodeAt(i * 2 + 1) << 8) | bin.charCodeAt(i * 2);
      }
      return buf;
    }

    function playPcm(int16, sampleRate) {
      if (!playCtx) {
        playCtx = new AudioContext();
        nextPlayTime = playCtx.currentTime + 0.05;
      }
      if (nextPlayTime < playCtx.currentTime) {
        nextPlayTime = playCtx.currentTime + 0.02;
      }
      const buffer = playCtx.createBuffer(1, int16.length, sampleRate);
      const channel = buffer.getChannelData(0);
      for (let i = 0; i < int16.length; i++) channel[i] = int16[i] / 0x8000;
      const src = playCtx.createBufferSource();
      src.buffer = buffer;
      src.connect(playCtx.destination);
      src.start(nextPlayTime);
      nextPlayTime += buffer.duration;
    }

    // ---------- WebSocket events ----------
    function handleEvent(evt) {
      if (evt.type === "session.ready") {
        localStorage.setItem("voice_session_id", evt.session_id);
        setStatus("Готов к разговору", "good");
        $("#btnTalk").disabled = false;
      }
      if (evt.type === "session.updated") {
        if (evt.vad_mode && currentMode === "stream") {
          $("#streamStatus").textContent = "Слушаю...";
          $("#streamStatus").className = "stream-status listening";
        }
      }
      if (evt.type === "conversation.item.input_audio_transcription.completed") {
        const text = evt.transcription || evt.transcript || "";
        if (text && text !== window._lastUserText) {
          addTurn("user", text);
          window._lastUserText = text;
        }
        setStatus(`Обработка... (STT: ${Date.now() - t0}ms)`, "warn");
      }
      if (evt.type === "response.output_text.delta") {
        if (!assistantSpeaking) {
          assistantSpeaking = true;
          console.log("[ASSISTANT] speaking started, notifying worklet");
          if (recorderNode) recorderNode.port.postMessage({ type: "assistantSpeaking", value: true });
        }
        $("#currentResponse").textContent += evt.delta || "";
      }
      if (evt.type === "response.output_audio.delta" && evt.delta) {
        playPcm(b64ToInt16(evt.delta), evt.sample_rate_hz || 24000);
        if (!firstAudio) {
          firstAudio = true;
          setStatus(`Отвечаю... (${Date.now() - t0}ms)`, "good");
        }
      }
      if (evt.type === "response.done") {
        // Don't clear assistantSpeaking immediately. TTS audio is queued in
        // the RTC track and still playing. Estimate playback from text length.
        const responseText = $("#currentResponse").textContent || "";
        const estimatedPlayMs = Math.max(2000, responseText.length * 60);
        console.log(`[ASSISTANT] response.done, keeping flag for ${estimatedPlayMs}ms`);
        setTimeout(() => {
          assistantSpeaking = false;
          if (recorderNode) recorderNode.port.postMessage({ type: "assistantSpeaking", value: false });
          console.log("[ASSISTANT] playback estimated done, cleared flag");
        }, estimatedPlayMs);
        const vt = evt.voice_timings || {};
        const totalMs = (t0 > 0) ? (vt.total_ms || (Date.now() - t0)) : 0;
        const text = $("#currentResponse").textContent.trim();
        if (text) addTurn("assistant", text, totalMs);
        $("#currentResponse").textContent = "";
        if (totalMs > 0) {
          setStatus(
            vt.stt_ms !== undefined
              ? `STT:${vt.stt_ms} RAG:${vt.rag_ms} LLM:${vt.llm_first_ms} TTS:${vt.tts_first_ms} = ${totalMs}ms`
              : `Готово: ${totalMs}ms`,
            "good"
          );
        } else {
          setStatus("Готов к разговору", "good");
        }
        // In streaming mode, show listening status after response
        if (currentMode === "stream" && !micMuted) {
          setTimeout(() => {
            $("#streamStatus").textContent = rtcPc ? "Слушаю... (WebRTC)" : "Слушаю...";
            $("#streamStatus").className = "stream-status listening";
          }, 500);
        }
      }
      if (evt.type === "warning") {
        setStatus(evt.message || "Предупреждение", "warn");
      }
      if (evt.type === "error") {
        setStatus(evt.error || "Ошибка", "danger");
      }
      if (evt.type === "interrupt") {
        assistantSpeaking = false;
        if (recorderNode) recorderNode.port.postMessage({ type: "assistantSpeaking", value: false });
        stopPlayback();
        // Also mute RTC audio playback if active
        const rtcAudio = $("#rtcAudio");
        if (rtcAudio && rtcAudio.srcObject) {
          rtcAudio.srcObject.getAudioTracks().forEach(t => t.enabled = false);
          // Re-enable after a short delay (server will send new audio for next response)
          setTimeout(() => {
            if (rtcAudio.srcObject) rtcAudio.srcObject.getAudioTracks().forEach(t => t.enabled = true);
          }, 500);
        }
        setStatus("Слушаю...", "warn");
      }
      if (evt.type === "rtc.answer") {
        if (rtcPc) {
          rtcPc.setRemoteDescription(new RTCSessionDescription({
            type: "answer",
            sdp: evt.sdp,
          }));
        }
      }
      if (evt.type === "rtc.offer_needed") {
        startRTC();
      }
    }

    // ---------- Connection ----------
    async function connectWS(startWithVAD) {
      if (connected) return;
      ws = new WebSocket(`${WS_BASE}/ws/voice`);
      ws.onopen = async () => {
        connected = true;
        setStatus("Подключение...", "warn");

        // Init audio
        audioCtx = new AudioContext();
        // Raw audio (no AEC). Barge-in detection uses energy in AudioWorklet.
        // AEC doesn't work reliably across devices (over-suppresses user voice).
        micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } });
        await audioCtx.audioWorklet.addModule("recorder-worklet.js");
        recorderNode = new AudioWorkletNode(audioCtx, "recorder-worklet");
        source = audioCtx.createMediaStreamSource(micStream);
        recorderNode.port.onmessage = (e) => {
          // Handle barge-in signal from AudioWorklet energy detection
          if (e.data && e.data.type === "bargeIn") {
            console.log(`[BARGE-IN] energy=${e.data.energy.toFixed(4)} baseline=${e.data.baseline.toFixed(4)}`);
            if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ type: "response.cancel" }));
            }
            stopPlayback();
            // Mute RTC audio if active
            const rtcAudio = document.getElementById("rtcAudio");
            if (rtcAudio && rtcAudio.srcObject) {
              rtcAudio.srcObject.getAudioTracks().forEach(t => t.enabled = false);
              setTimeout(() => {
                if (rtcAudio.srcObject) rtcAudio.srcObject.getAudioTracks().forEach(t => t.enabled = true);
              }, 500);
            }
            assistantSpeaking = false;
            setStatus("Слушаю...", "warn");
            return;
          }
          const pcm16 = e.data;
          // Gate WebSocket audio during TTS to prevent echo in STT.
          if (!talking && assistantSpeaking) return;
          if ((talking || continuousStreaming) && ws && ws.readyState === WebSocket.OPEN) {
            const b64 = btoa(String.fromCharCode(...new Uint8Array(pcm16.buffer)));
            ws.send(JSON.stringify({ type: "input_audio_buffer.append", audio: b64 }));
          }
        };
        source.connect(recorderNode);

        // If streaming mode: establish RTC FIRST (before intro), so AEC
        // covers the entire session including the greeting.
        if (startWithVAD) {
          await startRTC();
          micMuted = false;
          $("#btnMute").textContent = "Выключить микрофон";
          $("#btnMute").classList.remove("muted");
        }

        // Send session init (after RTC if streaming, so server can use RTC immediately)
        const savedSessionId = localStorage.getItem("voice_session_id");
        ws.send(JSON.stringify({ type: "session.init", session_id: savedSessionId || null }));

        if (startWithVAD) {
          ws.send(JSON.stringify({ type: "session.update", vad_mode: true }));
          // Hybrid: WebSocket audio always flows for STT.
          // RTC handles barge-in in parallel.
          continuousStreaming = true;
        }
      };
      ws.onmessage = (msg) => handleEvent(JSON.parse(msg.data));
      ws.onerror = () => setStatus("Ошибка соединения", "danger");
      ws.onclose = () => {
        connected = false;
        $("#btnTalk").disabled = true;
        setStatus("Отключено. Выберите режим для подключения.", "warn");
        if (currentMode === "stream") {
          $("#streamStatus").textContent = "Отключено";
          $("#streamStatus").className = "stream-status idle";
        }
      };
    }

    // ---------- Push-to-talk ----------
    function startTalking() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      if (playCtx && nextPlayTime > playCtx.currentTime) {
        stopPlayback();
        ws.send(JSON.stringify({ type: "response.cancel" }));
      }
      talking = true;
      $("#currentResponse").textContent = "";
      $("#btnTalk").classList.add("talking");
      $("#btnTalk").textContent = "Слушаю...";
      setStatus("Слушаю...", "warn");
    }

    function stopTalking() {
      if (!ws || !talking) return;
      talking = false;
      $("#btnTalk").classList.remove("talking");
      $("#btnTalk").textContent = "Говорить";
      setStatus("Обработка...", "warn");
      t0 = Date.now();
      firstAudio = false;
      ws.send(JSON.stringify({ type: "input_audio_buffer.commit" }));
    }

    // ---------- Transcript download ----------
    function downloadTranscript() {
      if (!turns.length) return;
      let md = "# Микро Лизинг - Транскрипт голосового разговора\n\n";
      md += `**Дата:** ${new Date().toLocaleDateString("ru-RU")}\n`;
      md += `**Время:** ${turns[0].time} - ${turns[turns.length - 1].time}\n\n---\n\n`;
      for (const t of turns) {
        const prefix = t.role === "user" ? "**Клиент:**" : "**Ассистент:**";
        const lat = t.latencyMs ? ` *(${t.latencyMs}ms)*` : "";
        md += `${prefix} ${t.text}${lat}\n\n`;
      }
      const blob = new Blob([md], { type: "text/markdown" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `transcript_${new Date().toISOString().slice(0, 10)}.md`;
      a.click();
    }

    // ---------- Event listeners ----------
    $("#btnTalk").addEventListener("mousedown", startTalking);
    $("#btnTalk").addEventListener("mouseup", stopTalking);
    $("#btnTalk").addEventListener("mouseleave", stopTalking);
    $("#btnTalk").addEventListener("touchstart", (e) => { e.preventDefault(); startTalking(); });
    $("#btnTalk").addEventListener("touchend", (e) => { e.preventDefault(); stopTalking(); });
    $("#btnDownloadPTT").addEventListener("click", downloadTranscript);
    $("#btnDownloadStream").addEventListener("click", downloadTranscript);
    </script>
  </body>
</html>
