<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIP Monitor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #ffffff; color: #1a1a1a; padding: 16px; }
  h1 { font-size: 18px; margin-bottom: 12px; color: #2c3e50; }
  .status { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
  .status.connected { background: #27ae60; }
  .status.disconnected { background: #e74c3c; }
  .controls { margin-bottom: 16px; }
  .controls button { background: #f0f0f0; color: #333; border: 1px solid #ccc; padding: 6px 14px; cursor: pointer; margin-right: 8px; font-family: monospace; border-radius: 3px; }
  .controls button:hover { background: #e0e0e0; }
  .calls { margin-bottom: 16px; }
  .call-badge { display: inline-block; background: #f8f9fa; border: 1px solid #dee2e6; padding: 4px 10px; margin-right: 8px; margin-bottom: 4px; border-radius: 4px; font-size: 13px; }
  .call-badge .phone { color: #27ae60; font-weight: bold; }
  .call-badge .duration { color: #8e44ad; margin-left: 8px; }
  .log { background: #fafafa; border: 1px solid #e0e0e0; padding: 12px; max-height: 75vh; overflow-y: auto; font-size: 13px; line-height: 1.6; }
  .log-entry { padding: 2px 0; border-bottom: 1px solid #f0f0f0; }
  .log-entry .ts { color: #999; margin-right: 8px; }
  .log-entry .cid { color: #8e44ad; margin-right: 6px; }
  .log-entry.caller .msg { color: #c0392b; font-weight: bold; }
  .log-entry.bot .msg { color: #2980b9; }
  .log-entry.tool .msg { color: #d35400; }
  .log-entry.barge-in .msg { color: #e74c3c; font-weight: bold; }
  .log-entry.system .msg { color: #999; font-style: italic; }
  .log-entry.dtmf .msg { color: #8e44ad; }
</style>
</head>
<body>
<h1><span class="status disconnected" id="statusDot"></span>SIP Monitor<span id="filterLabel"></span></h1>
<div class="controls">
  <button id="btnCopy">Copy All</button>
  <button id="btnClear">Clear</button>
</div>
<div class="setup" id="setupCard" style="background:#f8f9fa; border:1px solid #dee2e6; padding:12px; margin-bottom:16px; border-radius:4px; display:none;">
  <h3 style="font-size:14px; margin-bottom:8px;">Zoiper Setup</h3>
  <div style="font-size:13px; margin-bottom:8px;">
    <span style="color:#999;">Server:</span> <span id="sipServer" style="font-weight:bold;"></span>
    <span style="color:#999; margin-left:16px;">Transport:</span> UDP
  </div>
  <table style="font-size:13px; border-collapse:collapse;">
    <thead><tr>
      <th style="padding:2px 12px 2px 0; text-align:left; color:#999;">Username</th>
      <th style="padding:2px 12px 2px 0; text-align:left; color:#999;">Password</th>
      <th style="padding:2px 0; text-align:left; color:#999;"></th>
    </tr></thead>
    <tbody id="sipAccounts"></tbody>
  </table>
</div>
<div class="calls" id="activeCalls"></div>
<div class="log" id="log"></div>
<script>
(function() {
  var WS_BASE = location.protocol === 'https:' ? 'wss://' : 'ws://';
  var logEl = document.getElementById('log');
  var statusDot = document.getElementById('statusDot');
  var callsEl = document.getElementById('activeCalls');
  var ws = null;
  var autoScroll = true;
  var activeCalls = {};
  // URL filter: sip_monitor.html?user=sergey shows only Sergey's calls
  var filterUser = new URLSearchParams(location.search).get('user');
  var callToUser = {};  // call_id -> username mapping

  var pingInterval = null;

  if (filterUser) {
    document.getElementById('filterLabel').textContent = ' — ' + filterUser;
  }

  function connect() {
    // Clean up old connection before creating new one
    if (ws) {
      ws.onclose = null;
      ws.onerror = null;
      ws.onopen = null;
      ws.onmessage = null;
      if (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING) {
        ws.close();
      }
      ws = null;
    }
    if (pingInterval) { clearInterval(pingInterval); pingInterval = null; }

    ws = new WebSocket(WS_BASE + location.host + '/ws/sip-monitor');
    ws.onopen = function() {
      statusDot.className = 'status connected';
      addLog('system', '', 'Monitor connected');
      // Heartbeat: send ping every 15s to detect dead connections early
      pingInterval = setInterval(function() {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send('ping');
        }
      }, 15000);
    };
    ws.onclose = function() {
      statusDot.className = 'status disconnected';
      if (pingInterval) { clearInterval(pingInterval); pingInterval = null; }
      setTimeout(connect, 1500);
    };
    ws.onerror = function() {
      if (ws) ws.close();
    };
    ws.onmessage = function(e) {
      var msg = JSON.parse(e.data);
      handleEvent(msg);
    };
  }

  function handleEvent(msg) {
    var cid = (msg.call_id || '').substring(0, 8);
    var t = msg.type || '';

    // Track call_id -> sip_user mapping from call start event
    if (t === 'sip.call.start' && msg.sip_user) {
      callToUser[cid] = msg.sip_user;
    }

    // Filter: if ?user=sergey, only show events from Sergey's calls
    if (filterUser && cid && callToUser[cid] && callToUser[cid] !== filterUser) {
      if (t === 'sip.call.end') delete callToUser[cid];
      return;
    }

    if (t === 'sip.call.start') {
      activeCalls[cid] = { phone: msg.phone, user: msg.sip_user || '', start: Date.now() };
      updateCallBadges();
      var label = msg.sip_user ? msg.sip_user + ' (' + msg.phone + ')' : msg.phone;
      addLog('system', cid, 'Call started: ' + label);
    } else if (t === 'sip.call.end') {
      var dur = activeCalls[cid] ? formatDuration(Date.now() - activeCalls[cid].start) : '?';
      delete activeCalls[cid];
      updateCallBadges();
      addLog('system', cid, 'Call ended (' + dur + ')');
    } else if (t === 'sip.vad.speech') {
      if (msg.event === 'start') addLog('system', cid, 'VAD: speech start');
    } else if (t === 'sip.stt.result') {
      addLog('caller', cid, msg.text);
    } else if (t === 'sip.llm.sentence') {
      addLog('bot', cid, msg.text);
    } else if (t === 'sip.tool.start') {
      addLog('tool', cid, 'Tool: ' + msg.tool + '(' + JSON.stringify(msg.params || {}) + ')');
    } else if (t === 'sip.tool.result') {
      addLog('tool', cid, 'Tool done: ' + msg.tool + ' (' + (msg.ok ? 'OK' : 'FAIL') + ')');
    } else if (t === 'sip.tts.start') {
      addLog('bot', cid, '[TTS] ' + msg.text);
    } else if (t === 'sip.barge_in') {
      addLog('barge-in', cid, '** BARGE-IN **');
    } else if (t === 'sip.dtmf') {
      addLog('dtmf', cid, 'DTMF: ' + msg.digit);
    }
  }

  function addLog(cls, cid, text) {
    var el = document.createElement('div');
    el.className = 'log-entry ' + cls;

    var tsSpan = document.createElement('span');
    tsSpan.className = 'ts';
    var now = new Date();
    tsSpan.textContent = now.toLocaleTimeString('en-GB', { hour12: false });
    el.appendChild(tsSpan);

    if (cid) {
      var cidSpan = document.createElement('span');
      cidSpan.className = 'cid';
      cidSpan.textContent = '[' + cid + ']';
      el.appendChild(cidSpan);
    }

    var msgSpan = document.createElement('span');
    msgSpan.className = 'msg';
    msgSpan.textContent = text;
    el.appendChild(msgSpan);

    logEl.appendChild(el);
    if (autoScroll) logEl.scrollTop = logEl.scrollHeight;
  }

  function updateCallBadges() {
    while (callsEl.firstChild) callsEl.removeChild(callsEl.firstChild);
    for (var cid in activeCalls) {
      if (!activeCalls.hasOwnProperty(cid)) continue;
      var info = activeCalls[cid];
      var badge = document.createElement('span');
      badge.className = 'call-badge';

      var idText = document.createTextNode('#' + cid + ' ');
      badge.appendChild(idText);

      var phoneSpan = document.createElement('span');
      phoneSpan.className = 'phone';
      phoneSpan.textContent = info.user ? info.user + ' (' + info.phone + ')' : info.phone;
      badge.appendChild(phoneSpan);

      var durSpan = document.createElement('span');
      durSpan.className = 'duration';
      durSpan.id = 'dur-' + cid;
      badge.appendChild(durSpan);

      callsEl.appendChild(badge);
    }
  }

  function formatDuration(ms) {
    var s = Math.floor(ms / 1000);
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  // Update durations every second
  setInterval(function() {
    for (var cid in activeCalls) {
      if (!activeCalls.hasOwnProperty(cid)) continue;
      var el = document.getElementById('dur-' + cid);
      if (el) el.textContent = ' ' + formatDuration(Date.now() - activeCalls[cid].start);
    }
  }, 1000);

  // Auto-scroll control
  logEl.addEventListener('scroll', function() {
    autoScroll = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 20;
  });

  document.getElementById('btnCopy').addEventListener('click', function() {
    var lines = [];
    var entries = logEl.querySelectorAll('.log-entry');
    for (var i = 0; i < entries.length; i++) {
      lines.push(entries[i].textContent);
    }
    var text = lines.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(function() { fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  });

  document.getElementById('btnClear').addEventListener('click', function() {
    while (logEl.firstChild) logEl.removeChild(logEl.firstChild);
  });

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }

  // Load SIP credentials from API
  fetch('/api/jambonz/credentials')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.ok) {
        document.getElementById('sipServer').textContent = data.server;
        var accts = data.accounts || [{ username: data.username, password: data.password }];
        var tbody = document.getElementById('sipAccounts');
        for (var i = 0; i < accts.length; i++) {
          var tr = document.createElement('tr');
          var tdU = document.createElement('td');
          tdU.style.cssText = 'padding:2px 12px 2px 0; font-weight:bold;';
          tdU.textContent = accts[i].username;
          var tdP = document.createElement('td');
          tdP.style.cssText = 'padding:2px 12px 2px 0; font-family:monospace;';
          tdP.textContent = accts[i].password;
          var tdM = document.createElement('td');
          tdM.style.cssText = 'padding:2px 0;';
          var a = document.createElement('a');
          a.href = 'sip_monitor.html?user=' + accts[i].username;
          a.textContent = 'monitor';
          a.style.cssText = 'color:#2980b9; font-size:12px;';
          tdM.appendChild(a);
          tr.appendChild(tdU);
          tr.appendChild(tdP);
          tr.appendChild(tdM);
          tbody.appendChild(tr);
        }
        document.getElementById('setupCard').style.display = 'block';
      }
    })
    .catch(function() {});

  // Copy credentials removed (multiple accounts now shown in table with individual monitor links)

  connect();
})();
</script>
</body>
</html>
