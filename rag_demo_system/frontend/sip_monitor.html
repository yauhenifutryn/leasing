<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIP Monitor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #ffffff; color: #1a1a1a; padding: 16px; }
  h1 { font-size: 18px; margin-bottom: 12px; color: #2c3e50; }
  .status { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
  .status.connected { background: #27ae60; }
  .status.disconnected { background: #e74c3c; }
  .controls { margin-bottom: 16px; }
  .controls button { background: #f0f0f0; color: #333; border: 1px solid #ccc; padding: 6px 14px; cursor: pointer; margin-right: 8px; font-family: monospace; border-radius: 3px; }
  .controls button:hover { background: #e0e0e0; }
  .calls { margin-bottom: 16px; }
  .call-badge { display: inline-block; background: #f8f9fa; border: 1px solid #dee2e6; padding: 4px 10px; margin-right: 8px; margin-bottom: 4px; border-radius: 4px; font-size: 13px; }
  .call-badge .phone { color: #27ae60; font-weight: bold; }
  .call-badge .duration { color: #8e44ad; margin-left: 8px; }
  .log { background: #fafafa; border: 1px solid #e0e0e0; padding: 12px; max-height: 75vh; overflow-y: auto; font-size: 13px; line-height: 1.6; }
  .log-entry { padding: 2px 0; border-bottom: 1px solid #f0f0f0; }
  .log-entry .ts { color: #999; margin-right: 8px; }
  .log-entry .cid { color: #8e44ad; margin-right: 6px; }
  .log-entry.caller .msg { color: #c0392b; font-weight: bold; }
  .log-entry.bot .msg { color: #2980b9; }
  .log-entry.tool .msg { color: #d35400; }
  .log-entry.barge-in .msg { color: #e74c3c; font-weight: bold; }
  .log-entry.system .msg { color: #999; font-style: italic; }
  .log-entry.dtmf .msg { color: #8e44ad; }
  .log-entry.final .msg { color: #1e6091; font-weight: bold; background: #eaf3fb; padding: 1px 4px; border-radius: 2px; }
  .log-entry.final.interrupted .msg { color: #8a4d00; background: #fdf2e0; }
  .profile-panel { background: #f4f7fa; border: 1px solid #d6dee5; padding: 10px 12px; margin-bottom: 12px; border-radius: 4px; font-size: 12px; display: none; }
  .profile-panel h4 { font-size: 12px; margin-bottom: 6px; color: #2c3e50; }
  .profile-panel .pp-state { color: #2980b9; font-weight: bold; margin-bottom: 4px; }
  .profile-panel .pp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 2px 12px; }
  .profile-panel .pp-row .k { color: #888; }
  .profile-panel .pp-row .v { color: #1a1a1a; font-weight: bold; }
  .profile-panel .pp-row.empty .v { color: #ccc; font-weight: normal; }
  .profile-panel .pp-missing { color: #c0392b; margin-top: 4px; font-size: 11px; }
</style>
</head>
<body>
<h1><span class="status disconnected" id="statusDot"></span><span id="monitorTitle">SIP Monitor</span><span id="filterLabel"></span></h1>
<div class="controls">
  <select id="userFilter" style="font-family:monospace; padding:5px 8px; border:1px solid #ccc; border-radius:3px; margin-right:8px; background:#fff;">
    <option value="">All accounts</option>
  </select>
  <button id="btnCopy">Copy All</button>
  <button id="btnClear">Clear</button>
</div>
<div class="setup" id="setupCard" style="background:#f8f9fa; border:1px solid #dee2e6; padding:12px; margin-bottom:16px; border-radius:4px; display:none;">
  <h3 style="font-size:14px; margin-bottom:8px;">Zoiper Setup</h3>
  <div style="font-size:13px; margin-bottom:8px;">
    <span style="color:#999;">Server:</span> <span id="sipServer" style="font-weight:bold;"></span>
    <span style="color:#999; margin-left:16px;">Transport:</span> UDP
  </div>
  <table style="font-size:13px; border-collapse:collapse;">
    <thead><tr>
      <th style="padding:2px 12px 2px 0; text-align:left; color:#999;">Username</th>
      <th style="padding:2px 12px 2px 0; text-align:left; color:#999;">Password</th>
      <th style="padding:2px 0; text-align:left; color:#999;"></th>
    </tr></thead>
    <tbody id="sipAccounts"></tbody>
  </table>
</div>
<div class="calls" id="activeCalls"></div>
<!-- Profile snapshots render one panel per active call_id (chat or
     voice). The unfiltered operator monitor can show multiple at once
     when several sessions are live; filtered views (?session= or
     ?user=) naturally show only what passes the filter. Panels are
     created on first sip.profile.snapshot and removed on sip.call.end. -->
<div id="profilePanels"></div>
<div class="log" id="log"></div>
<script>
(function() {
  var WS_BASE = location.protocol === 'https:' ? 'wss://' : 'ws://';
  var logEl = document.getElementById('log');
  var statusDot = document.getElementById('statusDot');
  var callsEl = document.getElementById('activeCalls');
  var ws = null;
  var autoScroll = true;
  var activeCalls = {};
  // URL filters:
  //   sip_monitor.html?user=sergey      — only Sergey's voice calls
  //   sip_monitor.html?session=chat-XXX — only this chat session's events
  // Operator's main monitor (no params) keeps showing everything for
  // full visibility across voice + chat.
  var _qs = new URLSearchParams(location.search);
  var filterUser = _qs.get('user');
  var filterSession = _qs.get('session');     // e.g. "chat-iab1234"
  var callToUser = {};  // call_id -> username mapping (voice path)

  var pingInterval = null;

  var filterSelect = document.getElementById('userFilter');

  if (filterUser) {
    document.getElementById('filterLabel').textContent = ' — ' + filterUser;
  } else if (filterSession) {
    // Chat-embedded mode: this iframe lives inside chat_widget.html, so
    // SIP-flavored chrome (the "SIP" word, the Zoiper Setup card) is
    // noise. Shorten the title and hide the setup card; operator's
    // standalone monitor (no ?session= param) keeps full chrome.
    document.getElementById('monitorTitle').textContent = 'Monitor';
    document.getElementById('filterLabel').textContent = ' — chat ' + filterSession.substr(0, 12);
    var setupCard = document.getElementById('setupCard');
    if (setupCard) setupCard.style.display = 'none';
    // No dropdown switching while session-pinned (different filter axis).
    if (filterSelect) filterSelect.style.display = 'none';
  }

  // Dropdown changes filter without page reload. Clear log so the new
  // filter shows a fresh view (we don't store events, so we can't
  // retro-filter what's already on screen). Also re-render call badges
  // so concurrent calls from other users disappear from the active list.
  filterSelect.addEventListener('change', function() {
    filterUser = this.value || null;
    document.getElementById('filterLabel').textContent = filterUser ? ' — ' + filterUser : '';
    while (logEl.firstChild) logEl.removeChild(logEl.firstChild);
    updateCallBadges();
  });

  function connect() {
    // Clean up old connection before creating new one
    if (ws) {
      ws.onclose = null;
      ws.onerror = null;
      ws.onopen = null;
      ws.onmessage = null;
      if (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING) {
        ws.close();
      }
      ws = null;
    }
    if (pingInterval) { clearInterval(pingInterval); pingInterval = null; }

    ws = new WebSocket(WS_BASE + location.host + '/ws/sip-monitor');
    ws.onopen = function() {
      statusDot.className = 'status connected';
      addLog('system', '', 'Monitor connected');
      // Heartbeat: send ping every 15s to detect dead connections early
      pingInterval = setInterval(function() {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send('ping');
        }
      }, 15000);
    };
    ws.onclose = function() {
      statusDot.className = 'status disconnected';
      if (pingInterval) { clearInterval(pingInterval); pingInterval = null; }
      setTimeout(connect, 1500);
    };
    ws.onerror = function() {
      if (ws) ws.close();
    };
    ws.onmessage = function(e) {
      var msg = JSON.parse(e.data);
      handleEvent(msg);
    };
  }

  function handleEvent(msg) {
    var fullCid = msg.call_id || '';
    var cid = fullCid.substring(0, 8);
    var t = msg.type || '';

    // Track call_id -> sip_user mapping from call start event
    if (t === 'sip.call.start' && msg.sip_user) {
      callToUser[cid] = msg.sip_user;
    }

    // Filter: ?session=chat-XXX — only events whose full call_id matches
    // this chat session. Chat events tag call_id = session_id verbatim
    // (see backend/app.py _text_process_utterance), so a literal prefix
    // match is correct. The chat panel's iframe always passes its own
    // session_id; the operator's standalone monitor (no ?session=)
    // falls through to the user filter below.
    if (filterSession) {
      if (fullCid !== filterSession) return;
    } else if (filterUser && cid) {
      // Filter: if ?user=sergey, only show events from Sergey's calls.
      // Fail-closed when the call_id -> user mapping is unknown (call
      // started before this monitor session opened): otherwise events
      // from concurrent users leak through and logs get mixed.
      var mapped = callToUser[cid];
      if (!mapped || mapped !== filterUser) {
        if (t === 'sip.call.end') delete callToUser[cid];
        return;
      }
    }

    if (t === 'sip.call.start') {
      activeCalls[cid] = { phone: msg.phone, user: msg.sip_user || '', start: Date.now() };
      updateCallBadges();
      var label = msg.sip_user ? msg.sip_user + ' (' + msg.phone + ')' : msg.phone;
      addLog('system', cid, 'Call started: ' + label);
    } else if (t === 'sip.call.end') {
      var dur = activeCalls[cid] ? formatDuration(Date.now() - activeCalls[cid].start) : '?';
      delete activeCalls[cid];
      updateCallBadges();
      addLog('system', cid, 'Call ended (' + dur + ')');
      // Drop the per-call profile panel so the operator's view stays
      // tidy when sessions come and go. fullCid is what we keyed it on
      // so we look it up the same way.
      var endedPanel = document.getElementById('pp-' + fullCid);
      if (endedPanel) endedPanel.remove();
    } else if (t === 'sip.vad.speech') {
      if (msg.event === 'start') addLog('system', cid, 'VAD: speech start');
    } else if (t === 'sip.stt.result') {
      addLog('caller', cid, msg.text);
    } else if (t === 'sip.llm.sentence') {
      addLog('bot', cid, msg.text);
    } else if (t === 'sip.tool.start') {
      addLog('tool', cid, 'Tool: ' + msg.tool + '(' + JSON.stringify(msg.params || {}) + ')');
    } else if (t === 'sip.tool.result') {
      addLog('tool', cid, 'Tool done: ' + msg.tool + ' (' + (msg.ok ? 'OK' : 'FAIL') + ')');
    } else if (t === 'sip.tts.start') {
      addLog('bot', cid, '[TTS] ' + msg.text);
    } else if (t === 'sip.barge_in') {
      addLog('barge-in', cid, '** BARGE-IN **');
    } else if (t === 'sip.dtmf') {
      addLog('dtmf', cid, 'DTMF: ' + msg.digit);
    } else if (t === 'sip.llm.final') {
      // Authoritative full bot answer assembled after LLM+TTS completes.
      // Rendered distinctly so the operator can spot it among streaming
      // sentence deltas and confirm what the bot actually said in full.
      var prefix = msg.interrupted ? '✗ FINAL (interrupted): ' : '✓ FINAL: ';
      addLog('final' + (msg.interrupted ? ' interrupted' : ''), cid, prefix + (msg.text || ''));
    } else if (t === 'sip.profile.snapshot') {
      renderProfile(cid, fullCid, msg);
    }
  }

  // One profile panel per call_id. Created lazily on first snapshot,
  // updated in place on subsequent snapshots, removed on sip.call.end.
  // Keying on fullCid (not the 8-char prefix) avoids collisions when
  // two sessions happen to share a prefix.
  function renderProfile(cid, fullCid, msg) {
    var container = document.getElementById('profilePanels');
    var panelId = 'pp-' + fullCid;
    var panel = document.getElementById(panelId);
    if (!panel) panel = createProfilePanel(panelId, cid, fullCid);
    if (!panel.parentNode) container.appendChild(panel);

    var grid = panel.querySelector('.pp-grid');
    var stateEl = panel.querySelector('.pp-state');
    var missingEl = panel.querySelector('.pp-missing');
    panel.style.display = 'block';
    stateEl.textContent = 'state = ' + (msg.state || '?');
    while (grid.firstChild) grid.removeChild(grid.firstChild);
    var fields = msg.fields || {};
    var order = ['name', 'subject', 'cost', 'currency', 'client_type', 'condition_new',
                 'age_years', 'term_months', 'prepaid_pct', 'prepaid_amount', 'type_schedule'];
    // Bug C — render the BYN projection inline on the cost row when the
    // backend computed it (Физлицо + USD path). Operator sees both the
    // user's literal answer and what the calculator will actually use,
    // matching the readback's dual-disclosure behaviour.
    var convCost = msg.converted_cost;
    var convCur = msg.converted_currency;
    var showConv = (convCost !== null && convCost !== undefined
                    && (convCost !== fields.cost || convCur !== fields.currency));
    for (var i = 0; i < order.length; i++) {
      var k = order[i];
      var v = fields[k];
      var row = document.createElement('div');
      var hasVal = (v !== null && v !== undefined && v !== '');
      row.className = 'pp-row' + (hasVal ? '' : ' empty');
      var ks = document.createElement('span'); ks.className = 'k'; ks.textContent = k + ': ';
      var vs = document.createElement('span'); vs.className = 'v'; vs.textContent = hasVal ? String(v) : '—';
      row.appendChild(ks); row.appendChild(vs);
      if (k === 'cost' && hasVal && showConv) {
        var conv = document.createElement('span');
        conv.style.cssText = 'color:#8e44ad; margin-left:6px; font-weight:normal;';
        conv.textContent = '→ ' + convCost + ' ' + (convCur || '');
        row.appendChild(conv);
      }
      grid.appendChild(row);
    }
    var missing = msg.missing || [];
    missingEl.textContent = missing.length ? 'missing: ' + missing.join(', ') : 'all required fields captured';
  }

  // Build the DOM for one profile panel. The owner label distinguishes
  // chats ("chat <cid>") from voice accounts ("sergey (+37529...)") so
  // an operator looking at the unfiltered monitor can see at a glance
  // which session each profile snapshot belongs to.
  function createProfilePanel(panelId, cid, fullCid) {
    var panel = document.createElement('div');
    panel.id = panelId;
    panel.className = 'profile-panel';

    var info = activeCalls[cid] || {};
    var label;
    if (fullCid && fullCid.indexOf('chat-') === 0) {
      label = 'chat ' + fullCid.substr(0, 12);
    } else if (info.user && info.phone) {
      label = info.user + ' (' + info.phone + ')';
    } else if (info.user) {
      label = info.user;
    } else if (info.phone) {
      label = info.phone;
    } else {
      label = cid;
    }

    var h4 = document.createElement('h4');
    h4.appendChild(document.createTextNode('Profile snapshot '));
    var labelSpan = document.createElement('span');
    labelSpan.style.cssText = 'color:#888; font-weight:normal;';
    labelSpan.textContent = '[' + label + ']';
    h4.appendChild(labelSpan);
    panel.appendChild(h4);

    var stateDiv = document.createElement('div');
    stateDiv.className = 'pp-state';
    panel.appendChild(stateDiv);
    var gridDiv = document.createElement('div');
    gridDiv.className = 'pp-grid';
    panel.appendChild(gridDiv);
    var missingDiv = document.createElement('div');
    missingDiv.className = 'pp-missing';
    panel.appendChild(missingDiv);

    return panel;
  }

  function addLog(cls, cid, text) {
    var el = document.createElement('div');
    el.className = 'log-entry ' + cls;

    var tsSpan = document.createElement('span');
    tsSpan.className = 'ts';
    var now = new Date();
    tsSpan.textContent = now.toLocaleTimeString('en-GB', { hour12: false });
    el.appendChild(tsSpan);

    if (cid) {
      var cidSpan = document.createElement('span');
      cidSpan.className = 'cid';
      cidSpan.textContent = '[' + cid + ']';
      el.appendChild(cidSpan);
    }

    var msgSpan = document.createElement('span');
    msgSpan.className = 'msg';
    msgSpan.textContent = text;
    el.appendChild(msgSpan);

    logEl.appendChild(el);
    if (autoScroll) logEl.scrollTop = logEl.scrollHeight;
  }

  function updateCallBadges() {
    while (callsEl.firstChild) callsEl.removeChild(callsEl.firstChild);
    for (var cid in activeCalls) {
      if (!activeCalls.hasOwnProperty(cid)) continue;
      var info = activeCalls[cid];
      if (filterUser && info.user !== filterUser) continue;
      var badge = document.createElement('span');
      badge.className = 'call-badge';

      var idText = document.createTextNode('#' + cid + ' ');
      badge.appendChild(idText);

      var phoneSpan = document.createElement('span');
      phoneSpan.className = 'phone';
      phoneSpan.textContent = info.user ? info.user + ' (' + info.phone + ')' : info.phone;
      badge.appendChild(phoneSpan);

      var durSpan = document.createElement('span');
      durSpan.className = 'duration';
      durSpan.id = 'dur-' + cid;
      badge.appendChild(durSpan);

      callsEl.appendChild(badge);
    }
  }

  function formatDuration(ms) {
    var s = Math.floor(ms / 1000);
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  // Update durations every second
  setInterval(function() {
    for (var cid in activeCalls) {
      if (!activeCalls.hasOwnProperty(cid)) continue;
      var el = document.getElementById('dur-' + cid);
      if (el) el.textContent = ' ' + formatDuration(Date.now() - activeCalls[cid].start);
    }
  }, 1000);

  // Auto-scroll control
  logEl.addEventListener('scroll', function() {
    autoScroll = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 20;
  });

  document.getElementById('btnCopy').addEventListener('click', function() {
    var lines = [];
    var entries = logEl.querySelectorAll('.log-entry');
    for (var i = 0; i < entries.length; i++) {
      lines.push(entries[i].textContent);
    }
    var text = lines.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(function() { fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  });

  document.getElementById('btnClear').addEventListener('click', function() {
    while (logEl.firstChild) logEl.removeChild(logEl.firstChild);
  });

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }

  // Load SIP credentials from API. Skip entirely in chat-embedded mode
  // (filterSession set) — the iframe doesn't need Zoiper credentials,
  // and the fetch's success callback would re-show the setup card we
  // just hid above. We still fall through to connect() below so the
  // monitor WS opens and replays history.
  if (!filterSession) fetch('/api/jambonz/credentials')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.ok) {
        document.getElementById('sipServer').textContent = data.server;
        var accts = data.accounts || [{ username: data.username, password: data.password }];
        var tbody = document.getElementById('sipAccounts');
        for (var i = 0; i < accts.length; i++) {
          var tr = document.createElement('tr');
          var tdU = document.createElement('td');
          tdU.style.cssText = 'padding:2px 12px 2px 0; font-weight:bold;';
          tdU.textContent = accts[i].username;
          var tdP = document.createElement('td');
          tdP.style.cssText = 'padding:2px 12px 2px 0; font-family:monospace;';
          tdP.textContent = accts[i].password;
          var tdM = document.createElement('td');
          tdM.style.cssText = 'padding:2px 0;';
          var a = document.createElement('a');
          a.href = 'sip_monitor.html?user=' + accts[i].username;
          a.textContent = 'monitor';
          a.style.cssText = 'color:#2980b9; font-size:12px;';
          tdM.appendChild(a);
          tr.appendChild(tdU);
          tr.appendChild(tdP);
          tr.appendChild(tdM);
          tbody.appendChild(tr);
        }
        document.getElementById('setupCard').style.display = 'block';
        // Populate filter dropdown from accounts
        for (var j = 0; j < accts.length; j++) {
          var opt = document.createElement('option');
          opt.value = accts[j].username;
          opt.textContent = accts[j].username;
          if (filterUser === accts[j].username) opt.selected = true;
          filterSelect.appendChild(opt);
        }
      }
    })
    .catch(function() {});

  // Copy credentials removed (multiple accounts now shown in table with individual monitor links)

  connect();
})();
</script>
</body>
</html>
