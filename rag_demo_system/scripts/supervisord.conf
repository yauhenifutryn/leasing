[unix_http_server]
file=%(here)s/../.state/supervisor.sock

[supervisord]
nodaemon=false
logfile=%(here)s/../.state/supervisord.log
pidfile=%(here)s/../.state/supervisord.pid
childlogdir=%(here)s/../.state

[supervisorctl]
serverurl=unix://%(here)s/../.state/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:backend]
directory=%(here)s/..
command=/bin/sh -c ". %(here)s/../.env 2>/dev/null; exec ./.venv/bin/python -m uvicorn backend.app:app --host 0.0.0.0 --port 8000 --workers 4 --timeout-keep-alive 120"
autostart=true
autorestart=true
stdout_logfile=%(here)s/../.state/backend.log
stderr_logfile=%(here)s/../.state/backend.err.log

[program:frontend]
directory=%(here)s/../frontend
command=/bin/sh -c "exec python3 -m http.server 8081 --bind 127.0.0.1"
autostart=false
autorestart=true
stdout_logfile=%(here)s/../.state/frontend.log
stderr_logfile=%(here)s/../.state/frontend.err.log

[program:qwen]
directory=%(here)s/..
command=/bin/sh -c ". %(here)s/../.env 2>/dev/null; if [ -n \"$STACK_QWEN_CMD\" ]; then eval \"$STACK_QWEN_CMD\"; else echo 'STACK_QWEN_CMD not set'; sleep 3600; fi"
autostart=false
autorestart=false
startretries=0
stdout_logfile=%(here)s/../.state/qwen.log
stderr_logfile=%(here)s/../.state/qwen.err.log

