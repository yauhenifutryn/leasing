[supervisord]
nodaemon=false
logfile=%(here)s/../.state/supervisord.log
pidfile=%(here)s/../.state/supervisord.pid
childlogdir=%(here)s/../.state

[program:backend]
directory=%(here)s/..
command=/bin/sh -lc "python -m uvicorn backend.app:app --host 0.0.0.0 --port 8000"
autostart=true
autorestart=true
stdout_logfile=%(here)s/../.state/backend.log
stderr_logfile=%(here)s/../.state/backend.err.log

[program:frontend]
directory=%(here)s/../frontend
command=/bin/sh -lc "python -m http.server 8081 --bind 127.0.0.1"
autostart=false
autorestart=true
stdout_logfile=%(here)s/../.state/frontend.log
stderr_logfile=%(here)s/../.state/frontend.err.log

[program:qwen]
directory=%(here)s/..
command=/bin/sh -lc "if [ -n \"$STACK_QWEN_CMD\" ]; then eval \"$STACK_QWEN_CMD\"; else echo 'STACK_QWEN_CMD not set'; sleep 3600; fi"
autostart=true
autorestart=true
stdout_logfile=%(here)s/../.state/qwen.log
stderr_logfile=%(here)s/../.state/qwen.err.log

