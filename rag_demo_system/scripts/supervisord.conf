[unix_http_server]
file=%(here)s/../.state/supervisor.sock

[supervisord]
nodaemon=false
logfile=%(here)s/../.state/supervisord.log
pidfile=%(here)s/../.state/supervisord.pid
childlogdir=%(here)s/../.state

[supervisorctl]
serverurl=unix://%(here)s/../.state/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:backend]
directory=%(here)s/..
command=/bin/sh -c "set -a; . %(here)s/../.env 2>/dev/null; set +a; exec ./.venv/bin/python -m uvicorn backend.app:app --host 0.0.0.0 --port 8000 --workers 1 --timeout-keep-alive 120"
autostart=true
autorestart=true
stdout_logfile=%(here)s/../.state/backend.log
stderr_logfile=%(here)s/../.state/backend.err.log

[program:qwen]
directory=%(here)s/..
command=/bin/sh -c "set -a; . %(here)s/../.env 2>/dev/null; set +a; if [ -n \"$STACK_QWEN_CMD\" ]; then eval \"$STACK_QWEN_CMD\"; else echo 'STACK_QWEN_CMD not set'; sleep 3600; fi"
autostart=false
autorestart=false
startretries=0
stdout_logfile=%(here)s/../.state/qwen.log
stderr_logfile=%(here)s/../.state/qwen.err.log

[program:sessionagent]
directory=%(here)s/..
command=/bin/sh -c "set -a; . %(here)s/../.env 2>/dev/null; set +a; if [ -n \"$STACK_SESSIONAGENT_CMD\" ]; then eval \"$STACK_SESSIONAGENT_CMD\"; else echo 'STACK_SESSIONAGENT_CMD not set (single-instance mode)'; sleep 3600; fi"
autostart=false
autorestart=true
startretries=0
stdout_logfile=%(here)s/../.state/sessionagent.log
stderr_logfile=%(here)s/../.state/sessionagent.err.log

[program:whisper]
directory=%(here)s/..
command=/bin/sh -c "set -a; . %(here)s/../.env 2>/dev/null; set +a; if [ -n \"$STACK_WHISPER_CMD\" ]; then eval \"$STACK_WHISPER_CMD\"; else echo 'STACK_WHISPER_CMD not set'; sleep 3600; fi"
autostart=false
autorestart=true
stdout_logfile=%(here)s/../.state/whisper.log
stderr_logfile=%(here)s/../.state/whisper.err.log

[program:silero_tts]
directory=%(here)s/..
command=/bin/sh -c "set -a; . %(here)s/../.env 2>/dev/null; set +a; if [ -n \"$STACK_SILERO_TTS_CMD\" ]; then eval \"$STACK_SILERO_TTS_CMD\"; else echo 'STACK_SILERO_TTS_CMD not set'; sleep 3600; fi"
autostart=false
autorestart=true
stdout_logfile=%(here)s/../.state/silero_tts.log
stderr_logfile=%(here)s/../.state/silero_tts.err.log
